# Render Blueprint — Niter Centralized Dash
#
# One-click deploy: push this file to GitHub and create a Blueprint from the
# Render dashboard (New + -> Blueprint), or run `render blueprint launch`.
#
# Resources provisioned:
#   1. Web Service  - Python runtime, Daphne ASGI (HTTP + WebSockets)
#   2. PostgreSQL   - managed database, wired to DATABASE_URL
#   3. Redis        - managed Key Value, wired to REDIS_URL (Channels layer)
#
# NOTE: `runtime: python` is the current field name - the older `env: python`
# was deprecated by Render. The plan is `free`; switch to `starter`/`standard`
# for always-on uptime (free services spin down after 15 min of inactivity).
#
# Custom domain: niter.edu.bd is attached to the web service below. Render
# auto-provisions Let's Encrypt TLS for it — before launching the Blueprint,
# point the domain's DNS at Render (CNAME -> <service>.onrender.com, or
# A/AAAA -> Render's IPs). The www subdomain is handled automatically by
# Render (redirect to the root) and both hosts are in ALLOWED_HOSTS via
# config/settings.py's RENDER auto-config.

services:
  - type: web
    name: niter-centralized-dash
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    # Migrations run in the release phase: after the build succeeds and BEFORE
    # the new version starts serving. A failed migration aborts the deploy
    # while the current release keeps serving (previously `migrate` ran inside
    # build.sh, where a failure left the service in a broken state).
    releaseCommand: python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /
    # Deploys are gated by CI: .github/workflows/deploy.yml runs the test
    # suite and only then POSTs to this service's deploy hook. Turn off
    # Render's built-in auto-deploy so the webhook is the only path to
    # production — a red test suite means no deploy. Copy the hook URL from
    # Render -> Web Service -> Settings -> Deploy Hook (looks like
    # https://api.render.com/deploy/srv-<id>?key=<key>) and store it as the
    # RENDER_DEPLOY_HOOK_URL repository secret.
    autoDeploy: false
    # Custom domain — Let's Encrypt cert is provisioned automatically once DNS
    # points at Render (CNAME -> <service>.onrender.com). Remove if not live yet.
    domains:
      - niter.edu.bd
    envVars:
      # Pin the Python version used by Render's build image.
      - key: PYTHON_VERSION
        value: 3.12.3
      # Production hardening - never turn this on in production.
      - key: DEBUG
        value: "false"
      # Render generates and stores a random SECRET_KEY for this service.
      - key: SECRET_KEY
        generateValue: true
      # Managed PostgreSQL connection string (django-environ DATABASE_URL).
      - key: DATABASE_URL
        fromDatabase:
          name: niter-centralized-dash-db
          property: connectionString
      # Managed Redis connection string - Django Channels channel layer.
      # Same region/workspace => private-network URL is used automatically.
      - key: REDIS_URL
        fromService:
          type: redis
          name: niter-centralized-dash-redis
          property: connectionString
      # Optional Supabase PostgreSQL override. When set, config/settings.py
      # prefers SUPABASE_DB_URL over the managed DATABASE_URL above and forces
      # sslmode=require (build.sh runs migrations against it during the build).
      # Leave unset to keep using the managed Postgres. Add the same variable
      # to the worker service if you switch.
      # - key: SUPABASE_DB_URL
      #   value: postgres://postgres:<pw>@db.<project>.supabase.co:5432/postgres

      # OpenRouter — Research AI LLM provider (zero-cost free models).
      # sync: false => set the key in the Render dashboard once; Blueprint
      # syncs never overwrite the dashboard-set secret.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_DEFAULT_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free

      # NOTE: ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS are intentionally NOT set
      # here. config/settings.py auto-appends the platform domain AND the
      # custom domain (niter.edu.bd + www) whenever RENDER=true (set by the
      # platform). Any additional domains go in these env vars in THIS file
      # so Blueprint syncs keep them in sync.

  # Huey background worker — executes the async task queue (TF-IDF note
  # analysis etc.) off the web request path. Runs the djhuey consumer against
  # the same Redis used by the Channels layer. The web service's
  # releaseCommand runs migrations before either service starts serving.
  - type: worker
    name: niter-centralized-dash-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: python manage.py run_huey
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: niter-centralized-dash-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: niter-centralized-dash-redis
          property: connectionString

  # Managed Redis for Django Channels WebSocket broadcasting.
  # `type: redis` is the documented alias for Render's `keyvalue` service type.
  # ipAllowList: [] -> no public access; the web service connects over Render's
  # private network (connectionString resolves to the internal URL).
  - type: redis
    name: niter-centralized-dash-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

# Managed PostgreSQL (renders as a database resource named niter-centralized-dash-db).
# Free plan: 1 GB storage, expires 30 days after creation unless upgraded.
databases:
  - name: niter-centralized-dash-db
    plan: free
    databaseName: niter
    user: niter
