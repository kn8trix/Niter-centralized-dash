{% load static %}
<!-- PWA: manifest + install icons (palette #FBF9F5 / accent #EADCC9) -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#EADCC9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niter Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="{% static 'pwa/icon-180.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'pwa/icon-192.png' %}">
