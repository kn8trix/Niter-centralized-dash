<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %}</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter for Notion-style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#FBF9F5',
                        card: '#FFFFFF',
                        border: '#EBE6DF',
                        main: '#2B2927',
                        accent: '#EADCC9',
                        accentHover: '#D8CAB4',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #FBF9F5; color: #2B2927; }
        
        /* Custom scrollbar for Notion feel */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #EBE6DF; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #D8CAB4; }
        
        /* Sidebar transitions */
        .sidebar-link {
            transition: all 0.2s ease-in-out;
        }
        .sidebar-link:hover {
            background-color: #EADCC9;
            transform: translateX(2px);
        }
        .sidebar-link.active {
            background-color: #EADCC9;
            font-weight: 500;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex">
    
    {% block sidebar %}
    <!-- Sidebar -->
    <aside class="w-64 bg-card border-r border-border h-screen fixed top-0 left-0 flex flex-col overflow-y-auto">
        <!-- Logo Area -->
        <div class="p-6 border-b border-border">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center">
                    <svg class="w-5 h-5 text-main" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                </div>
                <span class="font-semibold text-lg tracking-tight">Niter Hub</span>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 p-4 space-y-1">
            <p class="text-xs font-medium text-main/40 uppercase tracking-wider px-3 mb-3">Menu</p>
            
            <a href="{% url 'dashboard' %}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Dashboard
            </a>
            
            <a href="{% url 'academic_notes' %}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                Academic & Notes
            </a>
            
            <a href="{% url 'notices' %}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path>
                </svg>
                Official Notices
            </a>
            
            <a href="{% url 'tickets' %}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                </svg>
                Bus & Meal Tickets
            </a>
            
            <a href="{% url 'medical' %}" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">
                <svg class="w-5 h-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>
                Medical Booking
            </a>
        </nav>
        
        <!-- User Profile / Logout -->
        <div class="p-4 border-t border-border">
            <div class="flex items-center gap-3 px-2">
                <div class="w-9 h-9 rounded-full bg-accent flex items-center justify-center text-sm font-medium">
                    JD
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate">John Doe</p>
                    <p class="text-xs text-main/50 truncate">Student</p>
                </div>
                <button class="p-1.5 hover:bg-base rounded-lg transition-colors">
                    <svg class="w-4 h-4 text-main/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </div>
    </aside>
    {% endblock %}
    
    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 ml-64 transition-all duration-200">
        <!-- Top Bar -->
        <header class="sticky top-0 z-10 bg-base/80 backdrop-blur-md border-b border-border">
            <div class="px-8 py-4 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-semibold tracking-tight">{% block header %}Dashboard{% endblock %}</h1>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Search -->
                    <div class="relative">
                        <input type="text" placeholder="Search..." class="w-64 bg-card border border-border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all">
                        <svg class="w-4 h-4 text-main/30 absolute right-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    
                    <!-- Notifications -->
                    <button class="relative p-2 hover:bg-card rounded-lg transition-colors border border-transparent hover:border-border">
                        <svg class="w-5 h-5 text-main/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                </div>
            </div>
        </header>
        
        <!-- Page Content -->
        <div class="p-8">
            {% block content %}
            <div class="bg-card rounded-xl border border-border p-6">
                <p class="text-main/60">Welcome to the dashboard.</p>
            </div>
            {% endblock %}
        </div>
    </main>
    
    <!-- Mobile Sidebar Toggle (Hidden on desktop) -->
    <button id="mobile-menu-btn" class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-card rounded-lg border border-border shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>
    
    <script>
        // Mobile / Desktop sidebar toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.querySelector('aside');
        const mainContent = document.getElementById('main-content');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                // toggle sidebar visibility (keeps existing behavior)
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('lg:translate-x-0');

                // also toggle main content left margin so content expands/reflows
                // original layout uses `ml-64` to offset the fixed sidebar; switch to `ml-0` when collapsed
                if (mainContent) {
                    mainContent.classList.toggle('ml-64');
                    mainContent.classList.toggle('ml-0');
                }
            });
        }

        // Set active link based on current URL
        const currentPath = window.location.pathname;
        const sidebarLinks = document.querySelectorAll('.sidebar-link');

        sidebarLinks.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
