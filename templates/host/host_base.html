{% extends "base.html" %}

{% block title %}Host Portal{% endblock %}

{% block sidebar %}
<!-- Host Sidebar (hidden on mobile by default; toggled via hamburger) -->
<aside data-region="sidebar" data-role="host" class="w-64 bg-card border-r border-border h-screen fixed top-0 left-0 flex flex-col overflow-y-auto -translate-x-full lg:translate-x-0 transition-transform duration-200 z-40 lg:z-auto">
    <div data-component="brand" class="p-6 border-b border-border">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center">
                <svg class="w-5 h-5 text-main" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <span class="font-semibold text-lg tracking-tight">Host Portal</span>
        </div>
    </div>

    <nav data-region="nav" class="flex-1 p-4 space-y-1">
        <p class="text-xs font-medium text-main/40 uppercase tracking-wider px-3 mb-3">Host Menu</p>
        <a href="{{ ENDPOINTS.medical_admin_dashboard }}" data-route="medical_admin_dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Medical Admin Dashboard</a>
        <a href="{{ ENDPOINTS.host_medical_dashboard }}" data-route="host_medical_dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Medical Dashboard</a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Appointments</a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Today's Queue</a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Reports</a>
        <a href="#" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-main/80 hover:text-main">Settings</a>
    </nav>

    <div data-component="profile" class="p-4 border-t border-border">
        <div class="flex items-center gap-3 px-2">
            <div class="w-9 h-9 rounded-full bg-accent flex items-center justify-center text-sm font-medium">MH</div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">Medical Host</p>
                <p class="text-xs text-main/50 truncate">Staff</p>
            </div>
        </div>
    </div>
</aside>
{% endblock %}
