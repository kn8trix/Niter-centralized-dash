{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Hub — Niter Hub</title>
    <meta name="description" content="Department hub with overview & announcements, faculty directory, class and lab schedules, and a semester-wise notes & PDF drive.">

    <!-- Global design tokens -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <!-- Shared top navigation -->
    <link rel="stylesheet" href="{% static 'css/topbar.css' %}">
    <!-- Department pages styles -->
    <link rel="stylesheet" href="{% static 'css/departments.css' %}">

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="dept-detail" data-app="campusdash-public" data-dept-slug="{{ dept_slug }}">

    <div class="shell">

        <!-- ============================================================
             Top bar (unified navigation)
        ============================================================ -->
        {% include 'partials/topbar.html' with active='departments' %}

        <div id="dept-app" data-base="{{ ENDPOINTS.departments }}">

            <!-- Back to directory -->
            <a class="dept-detail-back" href="{{ ENDPOINTS.departments }}"><i class="fa-solid fa-arrow-left"></i> All Departments</a>

            <!-- ============================================================
                 Centered department header (filled from mock JS data)
            ============================================================ -->
            <header class="dept-detail-head" id="dept-head" data-widget="dept-detail-header"></header>

            <!-- ============================================================
                 Interactive tab bar (client-side switching)
            ============================================================ -->
            <div class="dept-tabs" id="dept-tabs" role="tablist" aria-label="Department hub sections">
                <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="overview">
                    <i class="fa-solid fa-circle-info"></i> Overview &amp; Announcements
                </button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="faculty">
                    <i class="fa-solid fa-chalkboard-user"></i> Faculty Directory
                </button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="schedule">
                    <i class="fa-solid fa-calendar-days"></i> Class &amp; Lab Schedule
                </button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="notes">
                    <i class="fa-solid fa-file-lines"></i> Department Notes
                </button>
            </div>

            <!-- Tab panels (rendered from mock JS data) -->
            <section class="tab-panel active" id="tab-overview" role="tabpanel" aria-label="Overview & announcements"></section>
            <section class="tab-panel" id="tab-faculty" role="tabpanel" aria-label="Faculty directory"></section>
            <section class="tab-panel" id="tab-schedule" role="tabpanel" aria-label="Class and lab schedule"></section>
            <section class="tab-panel" id="tab-notes" role="tabpanel" aria-label="Department notes and PDF drive"></section>

        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

        // ====================================================================
        // DOM refs
        // ====================================================================

        const headEl = document.getElementById('dept-head');
        const toastEl = document.getElementById('toast');

            overview: document.getElementById('tab-overview'),
            faculty: document.getElementById('tab-faculty'),
            schedule: document.getElementById('tab-schedule'),
            notes: document.getElementById('tab-notes'),
        };

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3200);
        }

        // ====================================================================
        // Render helpers
        // ====================================================================
        function renderHeader(d) {
            headEl.innerHTML = `
                <span class="dept-detail-icon"><i class="fa-solid ${d.icon}"></i></span>
                <h1>Department of ${escapeHtml(d.name)} <span class="dept-code">${d.code}</span></h1>
                <p class="dept-detail-tagline">${escapeHtml(d.tagline)}</p>
                <div class="dept-stat-row">
                    <span class="dept-stat"><i class="fa-solid fa-calendar-check"></i> Est. ${d.established}</span>
                    <span class="dept-stat"><i class="fa-solid fa-user-group"></i> ${d.students} Students</span>
                    <span class="dept-stat"><i class="fa-solid fa-user-tie"></i> ${escapeHtml(d.hodName)}</span>
                    <span class="dept-stat"><i class="fa-solid fa-file-lines"></i> ${d.notes} Notes</span>
                </div>`;
        }

        function renderOverview(d) {
            const ann = d.announcements.map(a => `
                <article class="card announce-card" data-widget="dept-announcement">
                    <span class="announce-icon"><i class="fa-solid ${a.icon}"></i></span>
                    <div>
                        <span class="pill info">${a.badge}</span>
                        <h3>${escapeHtml(a.title)}</h3>
                        <p>${escapeHtml(a.body)}</p>
                        <time><i class="fa-regular fa-calendar"></i> ${a.date}</time>
                    </div>
                </article>`).join('');

            panels.overview.innerHTML = `
                <div class="card welcome-card" data-widget="dept-welcome">
                    <span class="chip-icon"><i class="fa-solid fa-hand-sparkles"></i></span>
                    <blockquote>
                        <p>“${escapeHtml(d.welcome)}”</p>
                        <cite>${escapeHtml(d.hodName)} <span>${escapeHtml(d.hodRole)}</span></cite>
                    </blockquote>
                </div>
                <div class="announce-list">${ann}</div>`;
        }

        function renderFaculty(d) {

                        <div class="faculty-top">
                            <span class="faculty-avatar">${initials}</span>
                            <h3>${escapeHtml(f.name)}<span>${escapeHtml(f.role)}</span></h3>
                        </div>
                        <p class="faculty-focus"><strong>Research focus:</strong> ${escapeHtml(f.focus)}</p>
                        <div class="faculty-meta">
                            <a href="mailto:${f.email}"><i class="fa-solid fa-envelope"></i> ${f.email}</a>
                            <span><i class="fa-regular fa-clock"></i> ${escapeHtml(f.office)}</span>
                            <span class="pill success office-badge"><i class="fa-regular fa-circle-check"></i> Office hours open</span>
                        </div>
                    </article>`;
            }).join('');
            panels.faculty.innerHTML = `<div class="faculty-grid">${cards}</div>`;
        }

        function renderSchedule(d) {
            const dayOrder = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
            const cards = dayOrder.map(day => {
                const periods = d.schedule[day] || [];
                if (!periods.length) return '';
                const labs = periods.filter(p => p.type === 'Lab').length;
                const lectures = periods.length - labs;
                const tag = labs && lectures ? `${lectures} L · ${labs} Lab` : (labs ? `${labs} Lab` : `${lectures} Lecture`);
                const rows = periods.map(p => `
                    <div class="period">
                        <span class="period-type" title="${p.type}"><i class="fa-solid ${p.type === 'Lab' ? 'fa-flask' : 'fa-chalkboard'}"></i></span>
                        <div class="period-info">
                            <strong>${p.code}</strong>
                            <small><i class="fa-solid fa-location-dot"></i> ${escapeHtml(p.room)}</small>
                        </div>
                        <span class="period-time"><i class="fa-regular fa-clock"></i> ${p.time}</span>
                    </div>`).join('');
                return `
                    <div class="card day-card" data-widget="dept-routine">
                        <div class="day-head">
                            <h3>${day}day</h3>
                            <span class="pill">${tag}</span>
                        </div>
                        <div class="period-list">${rows}</div>
                    </div>`;
            }).join('');

            panels.schedule.innerHTML = `
                <p class="schedule-note">Weekly routine — ${d.code} sample for the current semester. Friday is a weekly holiday; timings are subject to change.</p>
                <div class="schedule-grid">${cards}</div>`;
        }

        function renderNotes(d) {
            const sems = [...new Set(d.notes.map(n => n.sem))];
            const chips = sems.map((s, i) => `
                <button type="button" class="sem-btn ${i === 0 ? 'active' : ''}" data-sem="${escapeHtml(s)}">${escapeHtml(s)}</button>
            `).join('');

            panels.notes.innerHTML = `
                <div class="notes-toolbar">
                    <div class="semester-chips" id="sem-chips">${chips}</div>
                    <button type="button" class="btn-secondary upload-cta" id="upload-notes-btn">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Upload New Notes
                    </button>
                </div>
                <div class="notes-grid" id="notes-grid"></div>
                <div class="notes-empty" id="notes-empty" hidden role="status">
                    <i class="fa-solid fa-folder-open"></i>
                    <strong>No notes in this semester yet</strong>
                    <p>Use “Upload New Notes” to add materials for this semester.</p>
                </div>`;

            const grid = document.getElementById('notes-grid');
            const empty = document.getElementById('notes-empty');
            const chipsEl = document.getElementById('sem-chips');
            let activeSem = sems[0] || null;

            function applySem() {
                const list = d.notes.filter(n => !activeSem || n.sem === activeSem);
                grid.innerHTML = list.map(n => `
                    <article class="card note-card" data-widget="dept-note">
                        <div class="note-card-head">
                            <span class="note-file-icon"><i class="fa-solid fa-file-pdf"></i></span>
                            <h3>${escapeHtml(n.title)}</h3>
                        </div>
                        <div class="note-card-tags">
                            <span class="pill info">${n.sem}</span>
                            <span class="pill success">${n.type}</span>
                        </div>
                        <div class="note-card-meta">
                            <span><i class="fa-solid fa-weight-hanging"></i> ${n.size}</span>
                            <button type="button" class="btn-secondary note-dl">
                                <i class="fa-solid fa-download"></i> Download
                            </button>
                        </div>
                    </article>`).join('');
                empty.hidden = list.length > 0;
            }

            chipsEl.addEventListener('click', (e) => {
                const btn = e.target.closest('.sem-btn');
                if (!btn) return;
                chipsEl.querySelectorAll('.sem-btn').forEach(b => b.classList.toggle('active', b === btn));
                activeSem = btn.dataset.sem;
                applySem();
            });

            grid.addEventListener('click', (e) => {
                if (e.target.closest('.note-dl')) showToast('Download started — this is a mock link (no file served yet).');
            });

            document.getElementById('upload-notes-btn').addEventListener('click', () => {
                showToast('Notes upload is a frontend mock — the upload form will be wired to the backend soon.');
            });

            applySem();
        }

        // ====================================================================
        // Tab switching (client-side) + hash deep-linking
        // ====================================================================
        const tabButtons = document.querySelectorAll('#dept-tabs .tab-btn');
        const TAB_MAP = {
            '#tab-overview': 'overview',
            '#tab-faculty': 'faculty',
            '#tab-schedule': 'schedule',
            '#tab-notes': 'notes',
        };

        function activateTab(key) {
            tabButtons.forEach(btn => {
                const on = btn.dataset.tab === key;
                btn.classList.toggle('active', on);
                btn.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            Object.entries(panels).forEach(([k, el]) => el.classList.toggle('active', k === key));
        }

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                activateTab(btn.dataset.tab);
                history.replaceState(null, '', '#tab-' + btn.dataset.tab);
            });
        });

        // ====================================================================
        // Bootstrap
        // ====================================================================
        if (!dept) {
            // Unknown slug — graceful frontend fallback (mock)
            app.innerHTML = `
                <div class="card dept-missing" role="status">
                    <i class="fa-solid fa-building-circle-exclamation"></i>
                    <h2>Department not found</h2>
                    <p>“${escapeHtml(slug)}” is not in the mock department registry. Try one of the departments from the directory.</p>
                    <a class="btn-primary" href="${app.dataset.base}"><i class="fa-solid fa-arrow-left"></i> Back to Departments</a>
                </div>`;
        } else {
            renderHeader(dept);
            renderOverview(dept);
            renderFaculty(dept);
            renderSchedule(dept);
            renderNotes(dept);

            // Deep-link support: /departments/<slug>/#tab-notes opens the notes tab
            const initial = TAB_MAP[location.hash] || 'overview';
            activateTab(initial);
        }
    </script>
</body>
</html>
