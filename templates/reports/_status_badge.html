{% if report.status == 'pending' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-warningSoft text-warning">
        <span class="w-1.5 h-1.5 rounded-full bg-warning"></span>{{ report.get_status_display }}
    </span>
{% elif report.status == 'in_progress' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-infoSoft text-info">
        <span class="w-1.5 h-1.5 rounded-full bg-info animate-pulse"></span>{{ report.get_status_display }}
    </span>
{% elif report.status == 'resolved' %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-successSoft text-success">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>{{ report.get_status_display }}
    </span>
{% else %}
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-dangerSoft text-danger">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>{{ report.get_status_display }}
    </span>
{% endif %}
